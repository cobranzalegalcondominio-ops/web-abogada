<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web de Abogada - Publicado Gratis</title>
    <style>
        /* Estilos generales para un look moderno y limpio */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f7f6; /* Un gris muy claro de fondo */
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Estilo para la cabecera (Header) */
        header {
            background-color: #003366; /* Azul Marino Profesional */
            color: white;
            padding: 40px 0;
            border-bottom: 5px solid #004d99; /* Un toque de azul más claro */
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
        }

        /* Estilo para el contenido principal (Main) */
        main {
            max-width: 800px; /* Ancho máximo para que sea legible en PC */
            margin: 20px auto; /* Centrado */
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* Sombra suave */
        }

        /* Estilo específico para la imagen 'Hero' */
        img {
            max-width: 100%; /* Se ajusta al ancho del contenedor */
            height: auto; /* Mantiene la proporción */
            border-radius: 10px;
            margin-top: 30px;
            border: 3px solid #f0f0f0;
        }

        /* Estilo para el texto */
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Un pequeño botón decorativo para dar un toque final */
        .boton {
            display: inline-block;
            padding: 10px 25px;
            background-color: #003366;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>¡Sitio Web Publicado!</h1>
    </header>
    <main>
        <p>
            ¡Enhorabuena! Has publicado tu primera página web gratis usando GitHub Pages. 
            A continuación, puedes ver la imagen profesional que generamos para tu bufete de abogados.
        </p>
        
        <img src="gavel.jpg" alt="Mazo de abogado profesional sobre escritorio moderno">
        
        <br>
        <a href="#" class="boton">Contactar Bufete</a>
    </main>
</body>
</html>
